<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Information</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef1f5;
    color: #1f2937;
}

.header {
    background: #172033;
    color: white;
    padding: 28px 20px;
    text-align: center;
}

.company {
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0.8;
    margin-bottom: 8px;
}

.header h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 600;
}

.container {
    max-width: 520px;
    margin: 28px auto;
    padding: 0 16px;
}

.card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

.profile {
    text-align: center;
    padding: 30px 20px 24px;
}

.avatar {
    width: 88px;
    height: 88px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: #e8ecf2;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 40px;
}

.profile h2 {
    margin: 0;
    font-size: 23px;
    color: #111827;
}

.department {
    margin-top: 7px;
    color: #64748b;
    font-size: 15px;
}

.status {
    display: inline-block;
    margin-top: 14px;
    padding: 6px 14px;

    border-radius: 20px;

    background: #e8f5e9;
    color: #28743a;

    font-size: 13px;
    font-weight: bold;
}

.details {
    border-top: 1px solid #e5e7eb;
    padding: 6px 22px;
}

.row {
    display: flex;
    gap: 18px;

    padding: 16px 0;

    border-bottom: 1px solid #edf0f3;
}

.row:last-child {
    border-bottom: none;
}

.label {
    width: 105px;
    flex-shrink: 0;

    color: #64748b;
    font-size: 14px;
}

.value {
    flex: 1;

    color: #111827;
    font-size: 14px;
    font-weight: 600;

    word-break: break-word;
}

.footer {
    text-align: center;

    padding: 18px;

    color: #94a3b8;
    font-size: 12px;
}

@media (max-width: 400px) {

    .header h1 {
        font-size: 21px;
    }

    .row {
        gap: 10px;
    }

    .label {
        width: 90px;
    }

}

</style>

</head>

<body>

<header class="header">

    <div class="company">
        Chaolong Motor Part Indonesia
    </div>

    <h1>
        Employee Information
    </h1>

</header>


<main class="container">

<section class="card">


    <div class="profile">

        <div class="avatar">
            👤
        </div>

        <h2>
            Nugroho Kunto Aji
        </h2>

        <div class="department">
            Maintenance
        </div>

        <div class="status">
            ACTIVE
        </div>

    </div>


    <div class="details">


        <div class="row">

            <div class="label">
                Employee ID
            </div>

            <div class="value">
                1466.10.12.20
            </div>

        </div>


        <div class="row">

            <div class="label">
                Department
            </div>

            <div class="value">
                Maintenance
            </div>

        </div>


        <div class="row">

            <div class="label">
                Company
            </div>

            <div class="value">
                Chaolong Motor Part Indonesia
            </div>

        </div>


        <div class="row">

            <div class="label">
                Email
            </div>

            <div class="value">
                nugrohokuntoaji123@gmail.com
            </div>

        </div>


    </div>


</section>


<div class="footer">

    Employee Identification System

</div>


</main>

</body>
</html>
