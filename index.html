<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Employee Information</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef1f5;
    color: #1f2937;
}

/* HEADER */

.header {
    background: #172033;
    color: white;
    padding: 20px 15px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 500;
}

/* CONTAINER */

.container {
    max-width: 520px;
    margin: 32px auto;
    padding: 0 16px;
}

/* CARD */

.card {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

/* PROFILE */

.profile {
    text-align: center;
    padding: 30px 15px 28px;
}

/* FOTO */

.profile-photo {
    width: 150px;
    height: 150px;

    object-fit: cover;

    border-radius: 50%;

    border: 5px solid #e9edf3;

    display: block;

    margin: 0 auto 18px;
}

/* NAMA */

.profile h2 {
    margin: 0;

    font-size: 28px;

    font-weight: 600;

    color: #111827;
}

/* DEPARTMENT */

.department {
    margin-top: 6px;

    font-size: 19px;

    color: #6b7280;
}

/* STATUS */

.status {
    display: inline-block;

    margin-top: 16px;

    padding: 7px 20px;

    border-radius: 30px;

    background: #e8f7ec;

    color: #39734a;

    font-size: 16px;

    font-weight: 600;
}

/* DETAILS */

.details {
    border-top: 1px solid #e5e7eb;
    padding: 0 28px;
}

.row {
    display: flex;

    align-items: center;

    min-height: 68px;

    border-bottom: 1px solid #e5e7eb;
}

.row:last-child {
    border-bottom: none;
}

.label {
    width: 34%;

    font-size: 17px;

    color: #718096;

    flex-shrink: 0;
}

.value {
    width: 66%;

    font-size: 17px;

    color: #1f2937;

    white-space: nowrap;
}

/* EMAIL */

.email {
    font-size: 16px;
}

/* FOOTER */

.footer {
    text-align: center;

    margin-top: 22px;

    color: #9aa8bb;

    font-size: 15px;
}


/* MOBILE */

@media (max-width: 600px) {

    .header {
        padding: 20px 10px;
    }

    .header h1 {
        font-size: 28px;
    }

    .container {
        margin-top: 32px;
        padding: 0 16px;
    }

    .profile {
        padding: 30px 10px 28px;
    }

    .profile-photo {
        width: 150px;
        height: 150px;
    }

    .profile h2 {
        font-size: 28px;
    }

    .department {
        font-size: 19px;
    }

    .details {
        padding: 0 28px;
    }

    .label {
        font-size: 17px;
    }

    .value {
        font-size: 17px;
    }

    .email {
        font-size: 15px;
    }

}


/* HP KECIL */

@media (max-width: 400px) {

    .profile-photo {
        width: 135px;
        height: 135px;
    }

    .profile h2 {
        font-size: 25px;
    }

    .department {
        font-size: 18px;
    }

    .details {
        padding: 0 20px;
    }

    .label {
        width: 35%;
        font-size: 15px;
    }

    .value {
        width: 65%;
        font-size: 15px;
    }

    .email {
        font-size: 13px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header class="header">

    <h1>
        Employee Information
    </h1>

</header>


<!-- CONTENT -->

<main class="container">

<section class="card">


<!-- PROFILE -->

<div class="profile">

    <img
        src="https://raw.githubusercontent.com/Ziboneva123/Nugrohokuntoaji/main/file_0000000079fc8207a7ba37657a064a47.png"
        class="profile-photo"
        alt="Foto Nugroho Kunto Aji"
    >

    <h2>
        Nugroho Kunto Aji
    </h2>

    <div class="department">
        Maintenance
    </div>

    <div class="status">
        ACTIVE
    </div>

</div>


<!-- DATA -->

<div class="details">


    <div class="row">

        <div class="label">
            Employee ID
        </div>

        <div class="value">
            1466.10.12.20
        </div>

    </div>


    <div class="row">

        <div class="label">
            Department
        </div>

        <div class="value">
            Maintenance
        </div>

    </div>


    <div class="row">

        <div class="label">
            Company
        </div>

        <div class="value">
            Chaolong Motor Part Indonesia
        </div>

    </div>


    <div class="row">

        <div class="label">
            Email
        </div>

        <div class="value email">
            nugrohokuntoaji123@gmail.com
        </div>

    </div>


</div>


</section>


<div class="footer">
    Employee Identification System
</div>


</main>


</body>

</html>
