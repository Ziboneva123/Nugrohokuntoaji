<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Employee Information</title>


<style>

/* =========================================================
   BASIC
========================================================= */

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: #eaf6ff;

    background:

        radial-gradient(
            circle at 50% 20%,
            rgba(0, 153, 255, 0.18),
            transparent 30%
        ),

        radial-gradient(
            circle at 10% 80%,
            rgba(0, 110, 255, 0.12),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 70%,
            rgba(0, 200, 255, 0.10),
            transparent 30%
        ),

        #020b18;

    position: relative;

    overflow-x: hidden;

    /* BACKGROUND BERKEDIP HALUS */
    animation:
        electronicBlink
        1.8s
        ease-in-out
        infinite;
}


/* =========================================================
   ELECTRONIC BACKGROUND BLINK
========================================================= */

@keyframes electronicBlink {

    0% {
        filter:
            brightness(0.82);
    }

    25% {
        filter:
            brightness(1.02);
    }

    40% {
        filter:
            brightness(0.88);
    }

    60% {
        filter:
            brightness(1.08);
    }

    100% {
        filter:
            brightness(0.82);
    }
}


/* =========================================================
   ELECTRONIC GRID
========================================================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background-image:

        linear-gradient(
            rgba(0, 140, 255, 0.07) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0, 140, 255, 0.07) 1px,
            transparent 1px
        );

    background-size:
        35px 35px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 90%
        );

    z-index: 0;

    animation:
        gridBlink
        1.8s
        ease-in-out
        infinite;
}


@keyframes gridBlink {

    0% {
        opacity: 0.25;
    }

    25% {
        opacity: 0.70;
    }

    40% {
        opacity: 0.30;
    }

    60% {
        opacity: 0.80;
    }

    100% {
        opacity: 0.25;
    }
}


/* =========================================================
   ELECTRONIC CIRCUIT
========================================================= */

body::after {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 0;

    background:

        /* KIRI */

        linear-gradient(
            90deg,
            transparent 0%,
            transparent 7%,
            #008cff 7%,
            #008cff 7.2%,
            transparent 7.2%,
            transparent 15%,
            #006dcc 15%,
            #006dcc 15.15%,
            transparent 15.15%
        ),

        /* KANAN */

        linear-gradient(
            270deg,
            transparent 0%,
            transparent 7%,
            #00bfff 7%,
            #00bfff 7.2%,
            transparent 7.2%,
            transparent 15%,
            #006dcc 15%,
            #006dcc 15.15%,
            transparent 15.15%
        );

    background-size:

        100% 180px,
        100% 180px;

    background-position:

        0 80px,
        0 80px;

    background-repeat:
        repeat-y;

    animation:
        circuitBlink
        1.8s
        ease-in-out
        infinite;
}


@keyframes circuitBlink {

    0% {

        opacity: 0.18;

        filter:
            drop-shadow(
                0 0 2px #008cff
            );
    }

    25% {

        opacity: 0.75;

        filter:
            drop-shadow(
                0 0 8px #008cff
            );
    }

    40% {

        opacity: 0.22;

        filter:
            drop-shadow(
                0 0 3px #008cff
            );
    }

    60% {

        opacity: 0.90;

        filter:
            drop-shadow(
                0 0 12px #00bfff
            );
    }

    100% {

        opacity: 0.18;

        filter:
            drop-shadow(
                0 0 2px #008cff
            );
    }
}


/* =========================================================
   HEADER
========================================================= */

.header {

    position: relative;

    z-index: 2;

    background:

        linear-gradient(
            135deg,
            #020817,
            #061a32,
            #03101f
        );

    color: white;

    padding: 22px 15px;

    text-align: center;

    border-bottom:
        1px solid
        rgba(0, 174, 255, 0.55);

    box-shadow:
        0 0 25px
        rgba(0, 140, 255, 0.18);
}


.header::before {

    content: "";

    position: absolute;

    left: 5%;

    right: 5%;

    bottom: -2px;

    height: 2px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #008cff,
            #00d9ff,
            #008cff,
            transparent
        );

    animation:
        headerBlink
        1.8s
        ease-in-out
        infinite;
}


@keyframes headerBlink {

    0% {

        opacity: 0.30;

        box-shadow:
            0 0 4px #009dff;
    }

    25% {

        opacity: 0.90;

        box-shadow:
            0 0 14px #00bfff;
    }

    40% {

        opacity: 0.35;

        box-shadow:
            0 0 5px #009dff;
    }

    60% {

        opacity: 1;

        box-shadow:
            0 0 20px #00c8ff;
    }

    100% {

        opacity: 0.30;

        box-shadow:
            0 0 4px #009dff;
    }
}


.header h1 {

    margin: 0;

    font-size: 28px;

    font-weight: 500;

    letter-spacing: 1px;

    text-align: center;

    text-shadow:
        0 0 10px
        rgba(0, 180, 255, 0.55);
}


/* =========================================================
   CONTAINER
========================================================= */

.container {

    position: relative;

    z-index: 2;

    width: 100%;

    max-width: 520px;

    margin: 32px auto 0;

    padding: 0 16px;

    text-align: center;
}


/* =========================================================
   CARD
========================================================= */

.card {

    position: relative;

    width: 100%;

    background:

        linear-gradient(
            145deg,
            rgba(5, 28, 55, 0.97),
            rgba(2, 16, 34, 0.98)
        );

    border-radius: 20px;

    overflow: hidden;

    border:
        1px solid
        rgba(0, 153, 255, 0.55);

    box-shadow:

        0 0 10px
        rgba(0, 153, 255, 0.20),

        0 0 35px
        rgba(0, 115, 255, 0.13),

        inset 0 0 35px
        rgba(0, 140, 255, 0.05);
}


/* =========================================================
   CARD TOP LIGHT
========================================================= */

.card::before {

    content: "";

    position: absolute;

    top: 0;

    left: 25px;

    right: 25px;

    height: 1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #00bfff,
            transparent
        );

    animation:
        cardBlink
        2s
        ease-in-out
        infinite;
}


@keyframes cardBlink {

    0% {

        opacity: 0.25;

        box-shadow:
            0 0 3px #00bfff;
    }

    50% {

        opacity: 1;

        box-shadow:
            0 0 15px #00bfff;
    }

    100% {

        opacity: 0.25;

        box-shadow:
            0 0 3px #00bfff;
    }
}


/* =========================================================
   PROFILE
========================================================= */

.profile {

    text-align: center;

    padding:
        30px
        15px
        28px;

    background:

        radial-gradient(
            circle at center,
            rgba(0, 120, 255, 0.14),
            transparent 55%
        );
}


/* =========================================================
   FOTO
========================================================= */

.profile-photo {

    width: 150px;

    height: 150px;

    object-fit: cover;

    border-radius: 50%;

    border:
        5px solid #07182d;

    display: block;

    margin:
        0 auto 18px;

    box-shadow:

        0 0 0 2px #008cff,

        0 0 15px
        rgba(0, 170, 255, 0.75),

        0 0 35px
        rgba(0, 110, 255, 0.35);

    animation:
        photoBlink
        2s
        ease-in-out
        infinite;
}


@keyframes photoBlink {

    0% {

        box-shadow:

            0 0 0 2px #008cff,

            0 0 8px
            rgba(0, 170, 255, 0.35),

            0 0 18px
            rgba(0, 110, 255, 0.15);
    }

    50% {

        box-shadow:

            0 0 0 2px #00d9ff,

            0 0 22px
            rgba(0, 210, 255, 0.85),

            0 0 45px
            rgba(0, 110, 255, 0.40);
    }

    100% {

        box-shadow:

            0 0 0 2px #008cff,

            0 0 8px
            rgba(0, 170, 255, 0.35),

            0 0 18px
            rgba(0, 110, 255, 0.15);
    }
}


/* =========================================================
   NAME
========================================================= */

.profile h2 {

    margin: 0;

    font-size: 28px;

    font-weight: 600;

    color: #f4fbff;

    text-align: center;

    text-shadow:
        0 0 8px
        rgba(0, 180, 255, 0.25);
}


/* =========================================================
   DEPARTMENT
========================================================= */

.department {

    margin-top: 6px;

    font-size: 19px;

    color: #6fc9ff;

    text-align: center;

    text-shadow:
        0 0 8px
        rgba(0, 174, 255, 0.35);
}


/* =========================================================
   STATUS
========================================================= */

.status {

    display: inline-block;

    margin-top: 16px;

    padding:
        7px
        20px;

    border-radius: 30px;

    background:
        rgba(30, 255, 130, 0.10);

    border:
        1px solid
        rgba(80, 255, 150, 0.65);

    color: #72ff9d;

    font-size: 16px;

    font-weight: 600;

    box-shadow:
        0 0 12px
        rgba(50, 255, 130, 0.20);
}


/* =========================================================
   DETAILS
========================================================= */

.details {

    border-top:
        1px solid
        rgba(0, 150, 255, 0.30);

    padding:
        0
        44px;
}


.row {

    display: flex;

    align-items: center;

    min-height: 68px;

    border-bottom:
        1px solid
        rgba(0, 150, 255, 0.20);

    text-align: left;
}


.row:last-child {

    border-bottom: none;
}


.label {

    width: 34%;

    font-size: 17px;

    color: #65b9ee;

    flex-shrink: 0;

    text-align: left;
}


.value {

    width: 66%;

    font-size: 17px;

    color: #edf8ff;

    white-space: nowrap;

    text-align: left;
}


/* =========================================================
   EMAIL
========================================================= */

.email {

    font-size: 16px;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    width: 100%;

    text-align: center;

    margin-top: 24px;

    padding-bottom: 28px;

    color: #4c9ac7;

    font-size: 15px;

    text-shadow:
        0 0 8px
        rgba(0, 150, 255, 0.30);
}


/* =========================================================
   STILL HARDCORE
========================================================= */

.hardcore {

    width: 100%;

    margin-top: 10px;

    text-align: center;

    color: #00c8ff;

    font-size: 14px;

    font-weight: 600;

    letter-spacing: 3px;

    text-transform: uppercase;

    animation:
        hardcoreBlink
        2s
        ease-in-out
        infinite;
}


@keyframes hardcoreBlink {

    0% {

        opacity: 0.45;

        text-shadow:
            0 0 3px
            rgba(0, 200, 255, 0.25);
    }

    50% {

        opacity: 1;

        text-shadow:

            0 0 8px
            rgba(0, 200, 255, 0.85),

            0 0 20px
            rgba(0, 140, 255, 0.65);
    }

    100% {

        opacity: 0.45;

        text-shadow:
            0 0 3px
            rgba(0, 200, 255, 0.25);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .header {

        padding:
            20px
            10px;
    }

    .header h1 {

        font-size: 28px;

        text-align: center;
    }

    .container {

        width: 100%;

        margin-top: 32px;

        padding:
            0
            16px;

        text-align: center;
    }

    .profile {

        padding:
            30px
            10px
            28px;

        text-align: center;
    }

    .profile-photo {

        width: 150px;

        height: 150px;
    }

    .profile h2 {

        font-size: 28px;

        text-align: center;
    }

    .department {

        font-size: 19px;

        text-align: center;
    }

    .details {

        padding:
            0
            28px;
    }

    .label {

        font-size: 17px;

        text-align: left;
    }

    .value {

        font-size: 17px;

        text-align: left;
    }

    .email {

        font-size: 15px;
    }

    .footer {

        width: 100%;

        text-align: center;
    }

    .hardcore {

        width: 100%;

        text-align: center;
    }
}


/* =========================================================
   HP KECIL
========================================================= */

@media (max-width: 400px) {

    .profile-photo {

        width: 135px;

        height: 135px;
    }

    .profile h2 {

        font-size: 25px;

        text-align: center;
    }

    .department {

        font-size: 18px;

        text-align: center;
    }

    .details {

        padding:
            0
            25px;
    }

    .label {

        width: 35%;

        font-size: 15px;
    }

    .value {

        width: 65%;

        font-size: 15px;
    }

    .email {

        font-size: 13px;
    }

    .footer {

        width: 100%;

        text-align: center;

        font-size: 14px;
    }

    .hardcore {

        width: 100%;

        text-align: center;

        font-size: 12px;

        letter-spacing: 2.5px;
    }
}


/* =========================================================
   REDUCE MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    body,
    body::before,
    body::after,
    .header::before,
    .card::before,
    .profile-photo,
    .hardcore {

        animation: none;
    }
}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <h1>
        Employee Information
    </h1>

</header>


<!-- =====================================================

===================================================== -->

<main class="container">

<!-- =====================================================

<div class="profile">

    <img
