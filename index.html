<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Information</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef1f5;
    color: #1f2937;
}

/* HEADER */

.header {
    background: #172033;
    color: white;
    padding: 28px 20px;
    text-align: center;
}

.company {
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0.8;
    margin-bottom: 8px;
}

.header h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 600;
}

/* CONTAINER */

.container {
    max-width: 520px;
    margin: 28px auto;
    padding: 0 16px;
}

/* CARD */

.card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

/* PROFILE */

.profile {
    text-align: center;
    padding: 30px 20px 24px;
}

/* FOTO */

.profile-photo {
    width: 120px;
    height: 120px;

    margin: 0 auto 16px;

    border-radius: 50%;

    object-fit: cover;
    object-position: center;

    border: 4px solid #e8ecf2;

    display: block;
}

/* NAMA */

.profile h2 {
    margin: 0;
    font-size: 23px;
    color: #111827;
}

/* DEPARTMENT */

.department {
    margin-top: 7px;
    color: #64748b;
    font-size: 15px;
}

/* STATUS */

.status {
    display: inline-block;

    margin-top: 14px;

    padding: 6px 14px;

    border-radius: 20px;

    background: #e8f5e9;
    color: #28743a;

    font-size: 13px;
    font-weight: bold;
}

/* DATA */

.details {
    border-top: 1px solid #e5e7eb;
    padding: 6px 22px;
}

.row {
    display: flex;
    gap: 18px;

    padding: 16px 0;

    border-bottom: 1px solid #edf0f3;
}

.row:last-child {
    border-bottom: none;
}

.label {
    width: 105px;
    flex-shrink: 0;

    color: #64748b;
    font-size: 14px;
}

.value {
    flex: 1;

    color: #111827;
    font-size: 14px;
    font-weight: 600;

    word-break: break-word;
}

/* FOOTER */

.footer {
    text-align: center;
    padding: 18px;

    color: #94a3b8;
    font-size: 12px;
}

/* MOBILE */

@media (max-width: 400px) {

    .header h1 {
        font-size: 21px;
    }

    .row {
        gap: 10px;
    }

    .label {
        width: 90px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header class="header">

    <div class="company">
        Chaolong Motor Part Indonesia
    </div>

    <h1>
        Employee Information
    </h1>

</header>


<!-- CONTENT -->

<main class="container">

<section class="card">


    <!-- PROFILE -->

    <div class="profile">


        <!-- FOTO -->

        <img
            src="https://raw.githubusercontent.com/Ziboneva123/Nugrohokuntoaji/main/file_0000000079fc8207a7ba37657a064a47.png"
            class="profile-photo"
            alt="Foto Nugroho Kunto Aji"
        >


        <!-- NAMA -->

        <h2>
            Nugroho Kunto Aji
        </h2>


        <!-- DEPARTMENT -->

        <div class="department">
            Maintenance
        </div>


        <!-- STATUS -->

        <div class="status">
            ACTIVE
        </div>


    </div>


    <!-- DATA -->

    <div class="details">


        <div class="row">

            <div class="label">
                Employee ID
            </div>

            <div class="value">
                1466.10.12.20
            </div>

        </div>


        <div class="row">

            <div class="label">
                Department
            </div>

            <div class="value">
                Maintenance
            </div>

        </div>


        <div class="row">

            <div class="label">
                Company
            </div>

            <div class="value">
                Chaolong Motor Part Indonesia
            </div>

        </div>


        <div class="row">

            <div class="label">
                Email
            </div>

            <div class="value">
                nugrohokuntoaji123@gmail.com
            </div>

        </div>


    </div>


</section>


<!-- FOOTER -->

<div class="footer">
    Employee Identification System
</div>


</main>


</body>

</html>
